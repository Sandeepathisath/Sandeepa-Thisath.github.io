<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sandeepa Thisath — Computer Science Undergraduate at the University of Kelaniya & Full-Stack Developer portfolio."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sandeepa Thisath — Developer Portfolio" />
    <meta
      property="og:description"
      content="Computer Science undergraduate at the University of Kelaniya building clean web applications and practical software."
    />
    <meta name="theme-color" content="#0c111a" />
    <title>Sandeepa Thisath — Developer Portfolio</title>
    <script>
      ;(function () {
        try {
          var saved = localStorage.getItem('portfolio-theme')
          var theme = saved === 'light' || saved === 'dark' ? saved : 'dark'
          document.documentElement.setAttribute('data-theme', theme)
          document.documentElement.style.colorScheme = theme
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) {
            meta.setAttribute('content', theme === 'light' ? '#edf2f8' : '#0c111a')
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
