<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sandeepa Thisath — Computer Science Undergraduate at the University of Kelaniya & Full-Stack Developer portfolio."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sandeepa Thisath — Developer Portfolio" />
    <meta
      property="og:description"
      content="Computer Science undergraduate at the University of Kelaniya building clean web applications and practical software."
    />
    <meta name="theme-color" content="#070514" />
    <title>Sandeepa Thisath — Developer Portfolio</title>
    <script>
      ;(function () {
        try {
          var savedTheme = localStorage.getItem('portfolio-theme')
          var theme = savedTheme === 'light' || savedTheme === 'dark' ? savedTheme : 'dark'
          var savedWorld = localStorage.getItem('portfolio-world')
          var world =
            savedWorld === 'liquid-glass' ||
            savedWorld === 'galaxy' ||
            savedWorld === 'jungle' ||
            savedWorld === 'ocean'
              ? savedWorld
              : 'galaxy'
          document.documentElement.setAttribute('data-theme', theme)
          document.documentElement.setAttribute('data-world', world)
          document.documentElement.style.colorScheme = theme
          var colors = {
            'liquid-glass': { dark: '#0c111a', light: '#edf2f8' },
            galaxy: { dark: '#070514', light: '#f2f0fc' },
            jungle: { dark: '#05130f', light: '#eaf5ef' },
            ocean: { dark: '#03111c', light: '#e8f6fb' },
          }
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta && colors[world]) {
            meta.setAttribute('content', colors[world][theme])
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
